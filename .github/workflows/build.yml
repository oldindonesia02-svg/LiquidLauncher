name: Build Liquid Launcher
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project & Build APK
        run: |
          mkdir -p build-app/app/src/main/java/com/liquid/launcher
          mkdir -p build-app/app/src/main/res/values
          cd build-app

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LiquidLauncher"
          include(":app")
          EOF

          # root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.liquid.launcher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.liquid.launcher"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.02.01"))
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.core:core-ktx:1.12.0")
          }
          EOF

          # app/src/main/AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:allowBackup="true"
                  android:label="Liquid Launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnReset="true"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # app/src/main/java/com/liquid/launcher/MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/liquid/launcher/MainActivity.kt
          package com.liquid.launcher

          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ResolveInfo
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectVerticalDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.graphics.drawable.toBitmap
          import java.text.SimpleDateFormat
          import java.util.*

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      LiquidLauncherScreen()
                  }
              }
          }

          @Composable
          fun LiquidLauncherScreen() {
              val context = LocalContext.current
              val pm = context.packageManager
              var isDrawerOpen by remember { mutableStateOf(false) }
              var searchQuery by remember { mutableStateOf("") }

              val apps = remember {
                  val intent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }
                  pm.queryIntentActivities(intent, 0).sortedBy { it.loadLabel(pm).toString().lowercase() }
              }

              val filteredApps = apps.filter {
                  it.loadLabel(pm).toString().contains(searchQuery, ignoreCase = true)
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF0D0D11))
                      .pointerInput(Unit) {
                          detectVerticalDragGestures { _, dragAmount ->
                              if (dragAmount < -30) isDrawerOpen = true
                              if (dragAmount > 30) isDrawerOpen = false
                          }
                      }
              ) {
                  // Clock Glass Widget
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(top = 80.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      val time = remember { SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date()) }
                      val date = remember { SimpleDateFormat("EEEE, d MMMM", Locale.getDefault()).format(Date()) }

                      GlassContainer(modifier = Modifier.padding(horizontal = 24.dp)) {
                          Column(
                              modifier = Modifier.padding(vertical = 18.dp, horizontal = 32.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(text = time, color = Color.White, fontSize = 52.sp, fontWeight = FontWeight.Light)
                              Text(text = date, color = Color.White.copy(alpha = 0.7f), fontSize = 14.sp)
                          }
                      }
                  }

                  // Floating Liquid Dock
                  Box(
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .padding(horizontal = 20.dp, vertical = 32.dp)
                          .fillMaxWidth()
                          .height(88.dp)
                  ) {
                      GlassContainer(modifier = Modifier.fillMaxSize()) {
                          Row(
                              modifier = Modifier.fillMaxSize(),
                              horizontalArrangement = Arrangement.SpaceEvenly,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              apps.take(4).forEach { app ->
                                  AppIcon(app = app, pm = pm, showLabel = false) {
                                      val intent = pm.getLaunchIntentForPackage(app.activityInfo.packageName)
                                      intent?.let { context.startActivity(it) }
                                  }
                              }
                          }
                      }
                  }

                  // App Drawer
                  if (isDrawerOpen) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color.Black.copy(alpha = 0.92f))
                              .padding(top = 48.dp, start = 16.dp, end = 16.dp)
                      ) {
                          OutlinedTextField(
                              value = searchQuery,
                              onValueChange = { searchQuery = it },
                              placeholder = { Text("Search installed apps...", color = Color.Gray) },
                              singleLine = true,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(26.dp)),
                              colors = OutlinedTextFieldDefaults.colors(
                                  focusedTextColor = Color.White,
                                  unfocusedTextColor = Color.White,
                                  focusedContainerColor = Color.White.copy(alpha = 0.1f),
                                  unfocusedContainerColor = Color.White.copy(alpha = 0.05f),
                                  focusedBorderColor = Color.White.copy(alpha = 0.3f),
                                  unfocusedBorderColor = Color.Transparent
                              )
                          )

                          LazyVerticalGrid(
                              columns = GridCells.Fixed(4),
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(top = 18.dp)
                          ) {
                              items(filteredApps) { app ->
                                  AppIcon(app = app, pm = pm, showLabel = true) {
                                      val intent = pm.getLaunchIntentForPackage(app.activityInfo.packageName)
                                      intent?.let { context.startActivity(it) }
                                      isDrawerOpen = false
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun GlassContainer(modifier: Modifier = Modifier, content: @Composable BoxScope.() -> Unit) {
              val shape = RoundedCornerShape(32.dp)
              Box(
                  modifier = modifier
                      .shadow(16.dp, shape = shape, ambientColor = Color.Black.copy(alpha = 0.3f))
                      .clip(shape)
                      .background(Color.White.copy(alpha = 0.14f))
                      .border(
                          1.4.dp,
                          Brush.linearGradient(
                              listOf(
                                  Color.White.copy(alpha = 0.65f),
                                  Color.White.copy(alpha = 0.10f),
                                  Color.White.copy(alpha = 0.40f)
                              )
                          ),
                          shape
                      )
              ) {
                  content()
              }
          }

          @Composable
          fun AppIcon(app: ResolveInfo, pm: PackageManager, showLabel: Boolean, onClick: () -> Unit) {
              val iconBitmap = remember(app) {
                  app.loadIcon(pm).toBitmap(96, 96).asImageBitmap()
              }
              Column(
                  modifier = Modifier
                      .padding(6.dp)
                      .clickable { onClick() },
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Image(bitmap = iconBitmap, contentDescription = null, modifier = Modifier.size(48.dp))
                  if (showLabel) {
                      Text(
                          text = app.loadLabel(pm).toString(),
                          color = Color.White.copy(alpha = 0.9f),
                          fontSize = 11.sp,
                          maxLines = 1,
                          overflow = TextOverflow.Ellipsis,
                          textAlign = TextAlign.Center,
                          modifier = Modifier.padding(top = 4.dp)
                      )
                  }
              }
          }
          EOF

          # Gradle Setup & Build
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidLauncher-Debug-APK
          path: build-app/app/build/outputs/apk/debug/*.apk
          
